# Local development: runs with zero setup.
# Data is kept in ./data so balances and the bank key survive restarts.
spring.datasource.url=jdbc:h2:file:./data/offlinepay;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Dev-only JWT secret. Never use this outside your own machine.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}

logging.level.com.offlinepay=DEBUG
