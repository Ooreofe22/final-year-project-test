# -- Server --
server.port=${PORT:8081}

# -- Profile: dev (H2 file database, OTPs printed to the log) or prod (PostgreSQL, real emails) --
spring.profiles.active=${SPRING_PROFILE:dev}

# -- CORS (only matters for a web dashboard; the Android app is not a browser) --
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# -- JPA --
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# -- Auth --
jwt.secret=${JWT_SECRET}

# -- Wallet --
# Test naira every new user starts with, so the demo has money to move
wallet.signup-bonus=${WALLET_SIGNUP_BONUS:50000}

# -- Offline payments --
# Most a user can hold in their offline wallet at once (naira). This is the
# "bounded risk": no attack can ever cost more than this per device.
offline.wallet-limit=${OFFLINE_WALLET_LIMIT:20000}
# How long a payer certificate stays valid before the phone must go online and renew it
offline.certificate-validity-days=${OFFLINE_CERT_VALIDITY_DAYS:7}
# Optional: fix the bank's signing key (base64 PKCS#8). If empty, a key is generated
# once and stored in the database so certificates survive restarts.
offline.bank-private-key=${OFFLINE_BANK_PRIVATE_KEY:}

# -- Email (Resend) - only used under the prod profile --
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:OfflinePay <auth@example.com>}

# -- Admin dashboard --
# NOT production-grade auth - single shared header key (X-Admin-Key). Set a real value.
admin.api-key=${ADMIN_API_KEY:changeme-admin-key}
